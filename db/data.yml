  - - 275
    - " \"Obat tanpa Dosis\U0001F343 . Lhok Mata Ie, Aceh Besar - Terakhir kali kemari
      tahun 2018, Sewaktu masih Sma dulu. Karena rasa penasaran, Aku balik lagi kemari
      bareng mas @miladil.ambiya_ dari Pidie Jaya. Sambil menyusuri hutan kemarin,
      Kami sempat mengabadikan beberapa moment saat Tracking, Ya walaupun tujuan kami
      kemari sebenarnya bukan untuk Ngonten hahahah, Namanya juga Traveling, Hal yang
      paling dibutuhkan, salah satunya ya Kamera untuk mendokumentasikan hal hal random
      saat Tracking. . Begitu kami menginjakkan kaki diTepian Pantai, kami disambut
      pantai sunyi dan air sebening kaca. Tapi sesekali, bungkus mie instan atau botol
      air menyelip di antara semak belukar disana. Kami merasakan suasana pantai pada
      umumnya. Namun bedanya kali ini sedikit tenang, tanpa ada satupun orang disana,
      Ya mungkin karena Hari Senin ya, dimana orang pada sibuk kerja, kami malah kemari.
      . Ditengah kami menikmati alunan suara burung yang indah, Air yang jernih layaknya
      kaca, Hutan yang lebat, Kami ga lupa mengabadikan moment udara, Nah yang menariknya,
      Kami bisa melihat Gunung Seulawah Agam disana, Dan Pulau Sabang yang gakalah
      indah tentunya. . Namun dibalik keindahan Lhok Mata Ie ini, Kita manusia masih
      kurang sadar dalam hal Pengelolaan sampah yang benar, Dimana tumpukan sampah
      disana menjadi hal yang perlu diperhatikan supaya generasi selanjutnya dapat
      merasakan betapa indahnya ciptaan Tuhan yang satu ini. . Kalo mau ninggalin
      jejak, Usahain bukan sampah ya. Karena mencintai dan melindungi bukan hanya
      soal datang dan memuja tempat tersebut, Tapi juga soal pulang dengan Tanggung
      Jawab. Yuk sama sama Jaga kebersihan disana! \U0001F60D✨ . #WisataAceh #acehtourismtravel
      #acehbesar #lhokmataie #diacehaja\"."
