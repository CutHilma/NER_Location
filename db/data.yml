  - - 424
    - '"Jan Hwa Diana, pemilik CV Sentoso Seal, resmi ditetapkan sebagai tersangka
      oleh Direktorat Reserse Kriminal Umum (Ditreskrimum) Polda Jawa Timur atas dugaan
      penggelapan 108 ijazah milik mantan karyawannya. Penetapan ini dilakukan pada
      Kamis malam, 22 Mei 2025, setelah penyidik menemukan bukti kuat berupa ijazah-ijazah
      yang disembunyikan di rumah Diana . ￼ Pengungkapan Kasus Kasus ini mencuat setelah
      laporan dari mantan karyawan bernama Sasmita pada 22 April 2025. Penyelidikan
      yang dilakukan oleh Polda Jatim mengarah pada penggeledahan di empat lokasi
      berbeda, termasuk kantor dan gudang CV Sentoso Seal di Surabaya, serta rumah
      pribadi Diana. Dari hasil penggeledahan tersebut, penyidik menemukan 108 ijazah
      yang disimpan di rumah Diana . ￼ ￼ Proses Hukum Setelah penetapan sebagai tersangka,
      Diana dijerat dengan Pasal 372 KUHP tentang penggelapan, yang mengancam hukuman
      penjara maksimal empat tahun. Saat ini, ia ditahan di Rutan Polda Jatim untuk
      pemeriksaan lebih lanjut. Penyidik juga tidak menutup kemungkinan adanya tersangka
      lain dalam kasus ini seiring perkembangan penyidikan . ￼ ￼ Tanggapan Pihak Berwenang
      Wakil Direktur Reskrimum Polda Jatim, AKBP Suryono, menyatakan bahwa penahanan
      ijazah oleh perusahaan merupakan pelanggaran serius terhadap hak-hak pekerja.
      Ia menegaskan bahwa tindakan seperti ini tidak dapat dibenarkan dan akan ditindak
      sesuai hukum yang berlaku . ￼ Dampak Terhadap Korban Penahanan ijazah oleh perusahaan
      telah menghambat mantan karyawan dalam mencari pekerjaan baru, mengingat ijazah
      merupakan dokumen penting dalam proses rekrutmen. Kasus ini menjadi perhatian
      publik dan memicu diskusi mengenai perlindungan hak-hak pekerja di Indonesia.
      #JanHwaDiana #CVSentosoSeal #PenggelapanIjazah #KasusIjazah #PoldaJatim #BeritaTerkini
      #HakPekerja #Surabaya #BeritaViral #Tersangka #Kriminalitas #HukumIndonesia
      #GegerSurabaya".'
