    - '"Naga Umbang merupakan salah satu desa di Kecamatan Lhoknga, Aceh Besar yang
      sempat viral di TikTok dan media sosial lainnya selama setahun terakhir, karena
      terdapat satu warung di tepi sungai dengan suasana alam pegunungan nan sejuk.
      Untuk menuju Desa Naga Umbang, butuh waktu tempuh sekitar 45 menit menggunakan
      sepeda motor dari Kota Banda Aceh. Di sana, pengunjung tidak hanya disuguhi
      pemandangan hijau alam dan sungai, namun juga merasakan suasana angin sepoi-sepoi
      sambil menikmati menu favorite, jus Nipah yang juga sempat viral. Lisnawati
      sang pemiliki warung Warjakir Naga Umbang saat ditemui anteroaceh.com, mengaku
      sama sekali tidak menyangka bahwa warung yang ia jadikan sumber ekonominya itu
      akan seviral itu. "Kebetulan di sini (naga umbang) banyak buah nipah. Karena
      banyak, saya coba bawa pulang untuk diolah menjadi jus nipah" ujarnya, Minggu
      (10/9/2023) Lisna membuka warung itu pada tahun 2018 dan dulunya pengunjung
      hanya warga sekitar. Namun, setalah adanya buah nipah dan viral di tiktok sekitar
      bulan Oktober 2022 lalu, warungnya menjadi ramai didatangi pengunjung yang penasaran
      dengan jus Nipah racikannya. Selengkapnya baca di www.anteroaceh.com #anteroaceh
      #beritawisata #lhoknga #beritaacehhariini #jusnipah #wisataacehbesar".'
