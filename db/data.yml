  - - 333
    - " \"Tiap Gampong di Kuala Bireuen Bangun 1 Rumah Layak Huni kepada Warganya,
      Sumber Dana Desa BIREUEN – Kecamatan Kuala, Kabupaten Bireuen memiliki 20 desa.
      Kini setiap desa di Kecamatan Kuala, Kabupaten Bireuen membangun satu rumah
      layak huni kepada warga yang rumahnya tidak memenuhi syarat atau tak layak huni.
      Penetapan pembangunan satu rumah bagi warganya yang kurang mampu itu sebagaimana
      hasil musyawarah desa. Sedangkan program rehab rumah tidak diprioritaskan, karena
      hingga saat ini ada seratusan rumah lainnya tidak layak huni. Hal tersebut disampaikan
      Camat Kuala, Bireuen, Erizal STP, kepada Serambinews.com terkait program pengentasan
      kemiskinan ekstrem dan juga program prioritas penanganan kemiskinan melalui
      sumber dana desa tahun ini. Erizal menyebutkan masing-masing gampong membangun
      satu rumah layak huni kepada warganya dengan anggaran maksimal Rp 80 juta. Camat
      menambahkan dari dari 20 unit rumah yang dibangun itu, satu di antaranya sudah
      diserahkan kepada penerimanya. Sedangkan lainnya ada yang hampir siap atau sudah
      selesai 50 persen dan juga ada yang akan segera dibangun. Pembangunan rumah
      layak huni kepada warga kurang mampu atau selama ini menempati rumah tidak layak
      huni sesuai hasil musyawarah desa masing-masing. “Anggaran bantuan dana pada
      setiap desa dipergunakan sesuai hasil musyawarah dan juga berpedoman kepada
      Peraturan Bupati Bireuen tentang program prioritas mulai dari penanganan kemiskinan,
      ketahanan pangan maupun penyaluran Bantuan Tunai Langsung (BLT),” jelasnya.
      Berdasarkan data sementara, kata camat, mungkin ada 100 rumah lainnya yang layak
      dibangun baru karena kondisi sekarang kategori tidak layak huni, tentunya hasil
      musyawarah desa yang menetapkan nantinya. (*) Sumber : Serambi #bireuenkeras24jam
      #bireuen #beritabireuen #wisatabireuen\".\r\n\r\n"
