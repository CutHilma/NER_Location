  - - 221
    - '"Wisata sawah Gatra Kencana Bojongnangka, Kecamatan Pemalang meraup penghasilan
      hingga sebanyak Rp 1 miliar sampai dengan September 2022 / setahun berjalan.
      Objek wisata ini dikelola oleh badan usaha milik desa (Bumdes) Bojongnangka.
      Kepala Desa Bojongnangka, Wahmu mengatakan Gatra Kencana dikunjungi oleh wisatawan
      sebanyak ribuan orang. Harga tiket sebesar Rp 5.000 per orang. Wahana ini dibangun
      dengan dana desa Rp 293 juta ditambah dana swadaya. Konsep wisatanya adalah
      wisata desa edukasi pertanian dimana pengunjung bisa menikmati suasana persawahan
      yang dilengkapi dengan kolam renang, kolam terapi ikan dan rumah makan zadul.
      Baru-baru ini Gatra Kencana diresmikan oleh Plt Bupati Pemalang Mansur Hidayat.
