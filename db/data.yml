      jalur alam yang masih sangat alami. Begitu mendekati curug, rasa lelah berubah
      jadi kagum. Ada aliran air panas alami dan kawah kecil beruap yang eksotis banget!
      Angin hangat bercampur kabut belerang jadi atmosfer yang nggak biasa. Cuma dengan
      HTM total 30 ribu rupiah, kita bisa dapetin pengalaman alam yang luar biasa
