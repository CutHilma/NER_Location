    - "\"Alam Indonesia yang terkenal di mata dunia \U0001F60E\U0001F60E Gunung Rinjani
      di Nusa Tenggara Barat Keindahan Gunung Rinjani memang memukau banyak sekali
      para petualang manca negara. Tidak heran karena kekayaan alam Indonesia terbentang
      sepanjang negara. Terletak di Pulau Lombok, Rinjani memiliki panaroma yang bisa
      dibilang paling bagus di antara gunung-gunung di Indonesia. Setiap tahunnya
      (Juni-Agustus) banyak dikunjungi pencinta alam mulai dari penduduk lokal, mahasiswa,
      pecinta alam. Suhu udara rata-rata sekitar 20°C; terendah 12°C. Angin kencang
      di puncak biasa terjadi di bulan Agustus.  Saat hiking di Gunung Rinjani, sepanjang
      perjalanan kamu akan disuguhi pemandangan yang sangat indah hingga puncak Gunung
      Rinjani yang memiliki pemandangan satu Pulau Lombok. Di Pulau Lombok sendiri,
      kamu bisa menjelajahi pantai- pantai eksotisnya dengan pantai- pantai yang sangat
      indah. #beautifulindonesia\U0001F1EE\U0001F1E9 Cintai alam Indonesia, jaga kelestarian
      nya, jaga kebersihan jangan buang sampah sembarangan #indonesiakaya #indonesiaindah
      #pesonaindonesia #alamindonesia\"."
