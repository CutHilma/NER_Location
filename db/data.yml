    - '"Atraksi Pacuan kuda Pantai Wisata Kuala Jangka, Kabupaten Bireuen menyambut
      HUT ke-8 Semarak. Jangka merupakan Kecamatan pesisir yang terletak di Kabupaten
      Bireuen Provinsi Aceh. Pantai Jangka dahulunya hanya digunakan sebagai tempat
      nelayan mencari ikan. Penduduk rata-rata adalah nelayan tangkap dan petani.
      Lokasi yang awalnya digunakan sebagai rekreasi keluarga dan nelayan setempat
      lambat laun menjadi ramai. Daya tarik hasil tangkapan masyarakat yang menjual
      ikan segar dan jejeran pohon pinus di sepanjang pesisir pantai ini kian membuat
      pengunjung betah berlama-lama menikmati susana pantai. Atraksi pacuan kuda yang
      digelar dalam Rangka menyambut HUT Pantai Kuala Jangka ke-8, dihadiri oleh ratusan
      pengunjung dengan menampilkan kuda-kuda unggulan dari Bandung, Gayo Lues, Aceh
      Tengah dan Bener Meriah, ditunggangi oleh joki-joki yang sudah malang melintang
      di dunia perpacuan kuda. menambah ramai kunjungan wisatawan lokal, dan geliat
      ekonomi masyarakat pedagang ikut meningkat. #WisataBireuen sahabat sudah memacu
      kuda di pantai ini? #cahayaaceh #thelightofaceh #wisata #wonderfulindonesia".'
