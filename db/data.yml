    - ' "Indonesia baru saja memiliki presiden dan wakil presiden yang baru, yakni
      Prabowo Subianto yang tegas dan Gibran Rakabuming Raka yang merepresentasikan
      kalangan muda. Prabowo-Gibran diharapkan banyak membawa perubahan dan perbaikan,
      tak terkecuali di sektor pariwisata. Pengamat pariwisata Universitas Jenderal
      Soedirman (Unsoed) Chusmeru mengatakan selama ini pariwisata dijadikan salah
      satu andalan pendapatan negara di luar minyak, tambang, dan gas bumi. Namun
      dalam perjalanannya, ia menyebut pariwisata Indonesia dihadapkan dengan banyak
      masalah. "Ketegasan Prabowo dan kreativitas Gibran diharapkan mampu mengurai
      dan mengatasi segala masalah. Kabinet Merah Putih Prabowo-Gibran yang memisahkan
      pariwisata dengan ekonomi kreatif, merupakan harapan yang ditunggu dapat membawa
      perubahan," kata Chusmeru dalam keterangan resmi, Rabu, 23 Oktober 2024. #pariwisata
      #beritawisata #beritapariwisata #travel #pesonaindonesia".'
