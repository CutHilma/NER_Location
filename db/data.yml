    - "\"TNI Angkatan Laut (TNI AL) melalui Tim Fleet One Quick Response (F1QR) Pangkalan
      TNI AL (Lanal) Bangka Belitung (Babel) menggagalkan penyelundupan 25 ton pasir
      timah ilegal yang diduga akan dibawa ke Malaysia. Pasir timah ilegal yang diperkirakan
      bernilai miliaran rupiah tersebut dibawa oleh KM. Indah Jaya GT 34 di alur pelayaran
      Pelabuhan Pangkalbalam, Pangkalpinang, Minggu (1/6). Kepala Dinas Penerangan
      TNI AL, Laksmana Pertama I Made Wira Hady Arsanta Wardhana mengungkapkan kejadian
      ini bermula saat Tim F1QR Lanal Bangka Belitung melakukan pemantauan terhadap
      aktivitas penyelundupan di wilayah perairan Pangkalpinang. “Tak lama berselang,
      tim mendapati sebuah kapal mencurigakan yang tengah kandas di alur pelayaran
      Pelabuhan Pangkalbalam,” ujar Made dalam siaran pers TNI yang diterima Bangkapos.com,
      Senin (2/6). Tim Fleet One Quick Response (F1QR) dari Pangkalan TNI AL (Lanal)
      Bangka Belitung memeriksa muatan KM Indah Jaya GT 34 yang diduga adalah sekitar
      25 ton pasir timah ilegal, Minggu (1/6/2025). Pasir timah itu diduga hendak
      diselundupkan ke Malaysia melalui alur pelayaran Pelabuhan Pangkal Balam. (Dokumentasi
      TNI AL) Lanjut Made, setelah diperiksa kapal tersebut diketahui adalah kapal
      kayu KM Indah Jaya GT 34, yang ditandai dengan lambung kapal berwarna merah.
      “Namun saat tim mendekat, beberapa anak buah kapal (ABK) langsung melarikan
      diri ke arah hutan bakau di pesisir pantai,” beber Made. Ia menyebutkan, melihat
      adanya gelagat mencurigakan, tim segera naik ke kapal untuk melakukan pemeriksaan.
      “Hasilnya, tim menemukan karung-karung berisi pasir timah dengan total berat
      sekitar 25 ton yang disimpan di dalam palka kapal,” kata Made. \U0001F4F0 Sc
      : bangka.tribunnews \U0001F4E3 Jangan lupa untuk follow @halobabel untuk informasi
      tentang Bangka Belitung yang paling update ‼️ #halobabel #bangkabelitung #berita
      #infobangkabelitung #lokerbangkabelitung #bangkabarat #bangka #bangkatengah
      #bangkaselatan #pangkalpinang\"."
