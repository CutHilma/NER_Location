    - ACEH UTARA – Duka Minggu terakhir menjelang puasa di Laut Bangka Jaya, Aceh
      Utara. 3 bocah Laki-laki dilaporkan hilang terseret arus laut di Desa Keude
      Krueng Geukueh Kecamatan Dewantara, Aceh Utara. Minggu, (5/5/2019). Informasi
      diterima ACEHSATU.COM tiga korban yang hilang, Arif Aulia, 14 Tahun, Pelajar,
      Desa Ulee Nyeu Kec.Bandar Baro Kab.Aceh Utara. Muhammad Ijas 14 Tahun, Desa
      Ulee Nyeu Kec.Bandar Baro Kab.Aceh Utara. Imam Faluthi, 15 Tahun, Desa Ulee
      Nyeu Kec.Bandar Baro Kab.Aceh Utara. Kronologis Kejadian yang dihimpun ACEHSATU.com
      dari  Tempat  Kejadian  Perkara (TKP). Pada pukul 16.00 Wib awalnya Arif Aulia
      mandi di laut Desa Keude Kreung Geukuh Kec. Dewantara Kab. Aceh Utara. Sekitar
      50 (Lima Puluh Meter) dari bibir pantai, tiba tiba ARIF AULIA terbawa arus ke
      tengah laut, dan kemudian dilihat oleh Imam Faluthi dan Muhammad Ijas.".
