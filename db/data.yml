    - "55 likes, 1 comments - polres.acehutara on July 29, 2025: \"Satuan Binmas Polres
      Aceh Utara melaksanakan kegiatan Police Goes To School di SD Negeri 4 Tanah
      Pasir, Kecamatan Tanah Pasir, pada Rabu (30/7/2025).\n\nDalam kegiatan tersebut,
      Kanit Binkamsa Aipda Agusnawan menyampaikan pesan kepada para siswa agar menjunjung
      tinggi kedisiplinan baik di sekolah maupun di rumah sebagai kunci meraih kesuksesan.
      Ia juga mengingatkan pentingnya membatasi penggunaan ponsel karena dapat berdampak
      negatif terhadap mental, akhlak, dan kesehatan mata anak.\n\nSelain itu, siswa
      diimbau untuk mengonsumsi makanan sehat dan menghindari jajanan yang mengandung
      zat berbahaya. Kepada dewan guru, Aipda Agusnawan menekankan pentingnya metode
      pembelajaran yang ramah anak, serta menghindari kekerasan fisik dalam mendidik
      siswa.\n\nIa juga mengajak seluruh siswa untuk menolak tindakan bullying karena
      dapat menimbulkan dampak buruk bagi semua pihak yang terlibat.\n\nKegiatan ini
      disambut antusias oleh siswa dan guru, serta menjadi bagian dari upaya pembinaan
      dan penyuluhan kepada generasi muda di lingkungan sekolah.\". "
