  - - 119
    - "\"Universitas Malikussaleh (Unimal) membuat sejarah baru sepanjang berdirinya
      kampus tersebut. Kampus yang menjadi kebanggaan masyarakat Pase itu meraih Akreditasi
      Unggul dari Badan Akreditasi Nasional Perguruan Tinggi (BAN-PT). Hasil tersebut
      diumumkan secara resmi dalam aplikasi Sistem Akreditasi Perguruan Tinggi Online
      (SAPTO) pada Selasa (8/7/2025). Unimal mendapatkan total nilai 365, dari penilaian
      asesmen lapangan yang dilakukan pada 10-12 Juni lalu. Terdapat sembilan kriteria
      yang menjadi aspek penilaian oleh para asesor. Yaitu visi, misi dan tujuan strategis,
      tata pamong dan kerjasama, penjaminan mutu, kemahasiswaan, sarana prasarana,
      keuangan, sumber daya manusia (SDM), kurikulum, penelitian, serta pengabdian
      dan luaran. Rektor Unimal, Prof Dr Herman Fithra, Asean.Eng menyampaikan bahwa
      Akreditasi Unggul pada sebuah perguruan tinggi merupakan simbol bahwa lembaga
      atau perguruan tersebut sudah memenuhi syarat yang ditetapkan dengan komitmen
      dan kualitas yang bisa dipertanggungjawabkan berdasarkan standar nasional. Dengan
      diraihnya Akreditasi Unggul ini menciptakan sejarah baru di Universitas Malikussaleh
      (Unimal). Kampus yang dinegerikan pada 1 Agustus 2001 ini berarti sudah dapat
      bersaing dengan kampus-kampus besar dan ternama. “Kita patut bersyukur atas
      hasil yang telah didapat ini,” ujar Rektor. Sebelumnya kampus Aceh lainnya Universitas
      Syiah Kuala berhasil meraih akreditasi unggul Badan Akreditasi Nasional Perguruan
      Tinggi (BAN PT) sejak tahun 2022, sedangkan sejak tahun 2023, UIN Ar-Raniry
      juga telah merah Akreditasi Unggul dari Badan Akreditasi Nasional – Perguruan
      Tinggi (BAN-PT). Selengkapya di serambinews.com Selamat, tag temanmu alumni
      atau anak UNIMAL!\U0001F60E\U0001F601 Transportasi Ojek Online @grakjek #infobandaaceh
      #aceh #unimal #kampus #pendidikan #universitasmalikussaleh\"."
    - 1
    - '2025-07-13 13:02:13.278674'
    - '2025-07-13 13:02:13.278674'
  - - 120
    - "\"Akreditasi Unggul, Mimpi Unimal yang Kini Jadi Kenyataan Hari Selasa, 8 Juli
      2025, jadi momen bersejarah bagi keluarga besar Universitas Malikussaleh. Melalui
      aplikasi SAPTO, Unimal resmi dinyatakan meraih Akreditasi Unggul dari BAN-PT.
      Bagi sebagian orang, mungkin ini hanya sekadar status. Tapi bagi kami—yang melihat
      langsung bagaimana dosen-dosen bekerja keras menyusun borang, bagaimana tim
      akademik terus menyempurnakan kurikulum, dan bagaimana mahasiswa turut ambil
      bagian dalam menjaga mutu kampus—ini adalah bentuk nyata dari perjuangan yang
      panjang. Unimal bukan hanya kampus di Lhokseumawe. Ia adalah rumah bagi ribuan
      mimpi. Dan hari ini, rumah itu berdiri makin kokoh, siap menatap masa depan
      lebih luas. Dengan status Unggul, artinya kita tak lagi berjalan—kita sedang
      berlari. Menuju jejaring internasional, menuju kolaborasi yang lebih luas, menuju
      pengakuan bahwa kampus ini layak diperhitungkan di level nasional dan bahkan
      global. Terima kasih untuk semua yang sudah jadi bagian dari perjalanan ini.
      Hari ini kita rayakan, besok kita lanjutkan perjuangan. Unimal Unggul. Untuk
      Aceh. Untuk Indonesia. Sumber: aceh.tribunnews.com #peutrokhaba #unimal #lhokseumawe
      #acehutara"
