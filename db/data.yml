    - '"Hamparan sawit memang hijau, tapi tak mampu menyerap banjir, menyimpan karbon,
      atau melindungi satwa. Kita perlu lebih dari sekadar warna untuk menyebut sesuatu
      sebagai hutan. Dalam kurun waktu 2011 hingga 2023, luas perkebunan kelapa sawit
      di Indonesia meningkat dari 7,8 juta hektar menjadi 16,8 juta hektar, yang berarti
      pertumbuhan lebih dari dua kali lipat dalam periode tersebut. Beririsan dengan
      itu, selama dua dekade terakhir, industri sawit telah melahap 9,79 hektare hutan
      tropis di Indonesia (atau 11 persen dari luas hutan pada tahun 2000). Hutan
      adalah paru-paru dunia yang tidak tergantikan. Mengorbankannya untuk komoditas
      seperti sawit adalah keputusan yang harus dikaji ulang secara mendalam. #kebunsawit
      #hutan #deforestasi #hutangundul #karenabumicumasatu".'
