      ya! Coba naik ke atas, ada spot keren yang namanya Bale Kapal. Memang sih, perlu
      usaha sedikit buat naik sekitar 100 anak tangga, tapi percayalah, semua itu
      worth it. Dari atas, kamu bakal disuguhi panorama alam Karangasem yang indah.
      Arah tenggara, ada lautan biru yang berpadu cantik sama Pantai Ujung. Kalau
      lihat ke bawah, arsitektur unik Taman Ujung makin kelihatan memesona. Dan di
      sisi timur atas, Bukit Bisbis yang hijau bikin suasana makin adem dan damai.
