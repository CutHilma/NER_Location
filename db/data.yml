    - " \"Salam, Mt. Raung 3.344 MDPL\U0001F30B Gunung dengan kaldera terbesar kedua
      di Indonesia setelah Gunung Tambora Aku percaya, setiap gunung tidak selalu
      menjanjikan keindahan, tetapi setiap pendakian gunung pasti memberikan pelajaran
      ——————————— “Gunung Raung ini murni untuk aktivitas pendakian, bukan tempat
      untuk bersenang-senang,” kata Jupriyono, selaku Kepala Sekretariat Mt. Raung
      via Kalibaru. Sekarang aku mengerti mengapa Bapak berkata demikian. Gunung Raung,
      terutama via Kalibaru, memiliki medan pendakian yang sangat ekstrem. Terlebih
      lagi, tidak terdapat sumber mata air di sepanjang jalur, sehingga para pendaki
      diwajibkan membawa air mineral minimal 6 liter untuk pendakian selama 2 hari
