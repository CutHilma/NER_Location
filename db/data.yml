  - - 358
    - '"Pembangunan Ruas Jalan Keude Alue Rheng- Alue Kuta Peudada Bireuen Minta Ditambah
      5 Km Lagi Part 1 BIREUEN – Pembangunan ruas jalan Keude Alue Rheng-Alue Kuta,
      Peudada, Bireuen sumber dana inpres tahun ini panjangnya 11,5 Km dan sedang
      dikerjakan. Tapi diminta ditambah 5 Km lagi ke depan, sehingga masyarakat semakin
      mudah berkebun dan kawasan tersebut cepat berkembang. Permintaan pembangunan
      jalan ke arah selatan Cot Kruet Peudada disampaikan Adhari selaku Keuchik Alue
      Gandai, M Amin, Keuchik Pulo Ara, Bukhari Daud, Keuchik Cot Krut, Sulaiman,
      Keuchik Dayah Mon Ara serta Waled Abdullah selaku imum Mukim Pinto Rimba, Peudada
      Bireuen dan warga lainnya. Mereka meminta langsung kepada anggota Komisi V DPR
      RI dari PKB H Ruslan M Daud, Sabtu (07/10/2023) saat melihat kemajuan pekerjaan
      pembangunan jalan tersebut bersama pejabat PUPR Aceh. Dalam kunjungan tersebut,
      H Ruslan didampingi pejabat PUPR, perangkat desa dan tokoh masyarakat melihat
      pekerjaan mulai dari Desa Pulo Ara sampai ke Cot Kruet dan mendengar berbagai
      masukan dan harapan dari masyarakat. Keuchik Alue Gandai, Adahari mengatakan,
      hampir 10 tahun lebih kondisi jalan sulit dilewati, pembangunan jalan yang sedang
      dilakukan saat ini sumber dana Inpres masyarakat sangat berterimakasih atas
      dibangunnya ruas jalan aspal hotmix mulai dari pinggir jalan negara tembus ke
      lokasi transmigrasi berjarak sekitar 11, 5 Km. “Berkat kerja keras semua pihak
      dan utamanya H Ruslan, pembangunan jalan sudah terealisasi dan sedang dikerjakan,”
      ujarnya. Masyarakat sangat mengharapkan pembangunan ruas jalan selain 11,5 Km
      yang sedang dikerjakan hendaknya dibangun lagi sepanjang 5 Km lagi ke arah selatan.
      Dengan dibangunnya ruas jalan 5 KM lagi, aktivitas petani ke kebun dan mengangkut
      hasil bumi akan semakin mudah dan ekonomi masyarakat terus berkembang. Menanggapi
      harapan warga, H Ruslan berjanji akan memperjuangkan lanjutan pembangunan jalan
      tersebut. “Pembangunan beberapa ruas jalan termasuk lanjutan akan terus diupayakan
      dengan kementerian terkait selaku mitra kerja,” ujarnya.".'
