    - "\"[Padang > Mentawai > Padang] Tak pernah terbayangkan sebelumnya Sumatera
      Barat jadi provinsi perdana yang kukunjungi di pulau Sumatera padahal rencana
      awalku kalo bukan Aceh ya Bangka Belitung tapi ya namanya juga hidup kadang
      ada hal-hal yang terjadi di luar rencana awal kita. Definisi bisa makan sate
      Padang nasi Padang langsung di Padang. Tapi bukan hanya di Padang, kali ini
      berkesempatan untuk mengunjungi the beautiful islands yang ada di barat Sumatera
      Barat ini ---- Mentawai. Di tengah-tengah berita Megathrust yang sedang heboh-hebohnya
      pada masa itu pemuda ini tetap nekat ke Mentawai nih ceritanya karena terpapar
      dan teracuni fyp pulau SpongeBob di dunia nyata itu loh ha ha ha. Aku udah biasa
      nyebrang laut dari satu pulau ke pulau lain cuma memang mau kubilang kalau ombak
      menuju Mentawai ini is another level of ombak yang pernah kurasakan, bayangkan
      sepanjang perjalanan aku cuma bisa duduk di kursi kapal tanpa kemana-mana saking
      bergoyangnya kapal waktu itu. Gak salah sih Mentawai jadi salah satu spot surfing
      terbaik di Indonesia ya pasti karena ombaknya ya kalo enggak ada ombak mah gak
      bisa surfing adanya kita cuma snorkling \U0001F3C4\U0001F3FD‍♂️ Pengennya sih
      sekalian explore ke suku pedalaman cuma karna waktuku terbatas untuk trip Sumbar
      ini jadilah hanya menikmati keindahan laut dan pantai yang ada di Mentawai.
      Balik ke Padang nyobain naik @susiairofficial untuk pertama kalinya dan luar
      biasa experience nya \U0001F44D\U0001F3FD #mentawai #mentawaiisland #sumatera
      #sumaterabarat\"."
