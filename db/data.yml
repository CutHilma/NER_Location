  - - 70
    - '"Serpihan surga di Laut Pulau Rubiah Sabang Aceh. Penamaan Pulau Rubiah diambil
      dari nama tokoh kebanggaan masyarakat Aceh yaitu Siti Rubiah yang merupakan
      tokoh penyebaran agama Islam di Aceh. Di mana Siti Rubiah merupakan istri dari
      Tengku Ibrahim seorang ulama yang bergelar Tengku Iboih dan mereka tinggal di
      Pulau Weh, di Iboih Pidie. Karena perbedaan Paham mereka memutuskan untuk berpisah,
      dan membagi dua kekayaannya beserta tempat tinggal, di mana Tengku Ibrahim tetap
      tinggal di Iboih dan Siti Rubiah tinggal di samping Pulau Iboih. Beliau pun
      tinggal sampai akhir hayatnya, sehingga diberilah nama pulau ini Pulau Rubiah.
      Bukan hanya itu, dahulunya wisata Aceh ini merupakan pusat karantina pertama
      untuk jamaah haji dari Aceh, Sumatera dan daerah sekitarnya. Gedung karantina
      haji ini dibangun sekitar tahun 1920 pada masa pemerintahan Hindia Belanda.
      Bagi setiap orang yang hendak berangkat dan tiba dari tanah suci melalui jalur
      laut, wajib untuk karantina selama 40 hari di Pulau Rubiah ini karena dikhawatirkan
      membawa penyakit.".'
