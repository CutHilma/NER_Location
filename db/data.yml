  - - 73
    - '"Hasil autopsi ulang yang dilakukan terhadap Juliana Marins, warga Brasil yang
      meninggal saat mendaki Gunung Rinjani, telah dirilis pada Kamis (10/7/2025).
      Berdasarkan hasil autopsi yang dirilis Institut Kedokteran Forensik (IML) Rio
      de Janeiro, Juliana meninggal setelah jatuh dari ketinggian. Penyebab langsung
      kematiannya adalah pendarahan internal yang disebabkan oleh cedera di berbagai
      lokasi dan beberapa trauma, sebagaimana dilansir Globo. IML menyebutkan, Juliana
      mengalami beberapa cedera dan trauma seperti patah tulang panggul, dada, dan
      tengkorak, yang sesuai dengan jatuh dari ketinggian. Hasil autopsi di Brasil
      juga menunjukkan, Juliana meninggal antara 10 hingga 15 menit setelah menderita
      cedera. Setelah terjatuh, Juliana tidak dapat bergerak atau meminta bantuan
      karena luka-lukanya. Laporan tersebut menunjukkan kemungkinan Juliana mengalami
      kesakitan yang parah yang menyebabkan penderitaan fisik dan psikologis sebelum
      meninggal. Laporan juga menyebutkan, jenazah Juliana telah diawetkan atau dibalsem.
      Pengawetan tersebut membuat beberapa analisis terhambat, seperti memperkirakan
      waktu kematian dan memverifikasi tanda-tanda klinis yang lebih akurat. Juliana
      terjatuh saat pendakian menuju puncak atau summit attack dari tepi jurang Cemara
      Nunggal ke arah Danau Segara Anak pada 21 Juni. Jenazahnya berhasil dievakuasi
      pada 25 Juni setelah tim pencari dan penyelamat berjibaku hingga mempertaruhkan
      jiwanya. Sumber: Kompas.com #pendakigunung #pendakiindonesia #parapendaki #rinjani
      #julianamarins".'
