    - '"SURATKABARGENTA.ID, WISATA - Keindahan Raja Ampat memang sudah kesohor hingga
      ke luar negeri, tak heran jika banyak orang yang ingin bertandang ke tempat
      tersebut. Sayangnya, biaya perjalanan wisata ke Raja Ampat tidaklah murah, belum
      lagi akomodasi dan lain-lain. Alternatifnya, Anda bisa kunjungi Ulu Kasok, sebuah
      destinasi wisata di Kabupaten Kampar, Riau. Ulu Kasok memang bukan Raja Ampat,
      tetapi destinasi wisata yang satu ini menawarkan keindahan layaknya situs wisata
      populer tersebut dengan gugusan pulau yang dikelilingi oleh air. Bedanya, jika
      pulau-pulau di Raja Ampat dikelilingi oleh laut, maka di Ulu Kasok Anda akan
      menemukan pulau-pulau kecil yang dikelilingi air danau. Dari jauh, Ulu Kasok
      sangat mirip dengan Raja Ampat yang penuh pulau karang berbalut lautan biru
      Hampir semua wisatawan yang datang bertujuan untuk mendapatkan foto dengan background
      lanskap mirip Raja Ampat ini. Tenang saja, selain berswafoto, ada juga warga
      lokal yang menawarkan jasa untuk memfoto dengan tarif murah sehingga Anda bisa
      bebas berfoto sendiri maupun dengan pasangan. Selain itu, Anda juga bisa menyewa
      speedboat untuk berkeliling danau dan melihat pulau-pulau kecil tersebut dari
      dekat. Berita selengkapnya, yok kunjungi website kami suratkabargenta.id LINK
      IN BIO #suratkabargentaid #beritawisata".'
