    - "\"\U0001F90DKirim ucapan belasungkawa & pelukan virtual untuk Ibnu, ya Dunsanak.
      Berikan kata semangat di bawah!\U0001F917 Duka Bertubi-tubi Ibnu: Kehilangan
      Ibu dan Kakak Sekaligus dalam Kasus Pembunuhan di Padang Pariaman Tangis Muhamad
      Tri Ibnu Rusdi (16) pecah saat menyaksikan sang ibu, Nila Yunista (50), mengembuskan
      napas terakhir. Nila meninggal dunia setelah mendapat kabar tragis bahwa anak
      keduanya, Siska Oktavia, ditemukan tewas diduga menjadi korban pembunuhan sadis
      oleh SJ seorang pria yang dikenal dekat dengan keluarga mereka. Peristiwa memilukan
      ini terjadi di Kecamatan Batang Anai, Kabupaten Padang Pariaman, Sumatera Barat.
      Selama lebih dari satu tahun, Nila tak pernah lelah mencari Siska yang dilaporkan
      hilang sejak 12 Januari 2024 lalu. Harapan demi harapan ia gantungkan agar putrinya
      kembali pulang dengan selamat. Siska diketahui masih berstatus mahasiswi di
      salah satu perguruan tinggi di Kota Padang. Namun, semua harapan itu sirna dalam
      sekejap. Begitu menerima kabar bahwa Siska ditemukan dalam keadaan tak bernyawa,
      Nila dilaporkan syok berat. la jatuh pingsan di dekat lokasi penemuan jasad,
      dan tak lama kemudian dinyatakan meninggal dunia. Di rumah duka yang sederhana
      itu, duka mendalam menyelimuti. Tangis Ibnu pecah di tengah pelayat yang terus
      berdatangan. Sesekali ia mengusap air mata, menyambut pelukan dan ucapan belasungkawa
      dari para tetangga dan kerabat. Ketika Tim Tribun menyambangi rumah duka, Kamis
      (19/6/2025), Ibnu tampak duduk di sudut ruangan, tak jauh dari jasad sang ibu
      yang terbujur kaku. . Sc: Tribunpadang.com #perantauminang #infosumaterabarat
      #sumaterabarat #sumbar #padangpariaman #infoterkini #beritaterkini #infoterupdate
