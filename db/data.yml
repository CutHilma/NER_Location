    - '"Tradisi pawai keliling Gema Takbiran di Masjid Raya Baiturrahman, Banda Aceh,
      adalah salah satu momen yang sangat berarti dan meriah dalam perayaan Hari Raya
      Idul Fitri di Aceh. Pawai ini merupakan bagian dari tradisi budaya yang telah
      berlangsung selama bertahun-tahun dan menjadi bagian dari perayaan Idul Fitri
      di wilayah Aceh. . Pawai dimulai dari Masjid Raya Baiturrahman dan mengelilingi
      berbagai jalan di sekitar kota Banda Aceh. Suasana kota dipenuhi dengan semangat
      kegembiraan dan kebersamaan. Selama pawai, para peserta mengumandangkan takbir
      dan zikir, serta menyalakan obor sebagai simbol keberkahan dan kesyukuran atas
      berakhirnya bulan Ramadan dan datangnya Hari Raya Idul Fitri. . Temukan Indonesiamu
      di @indonesiana.tv #indonesianatv #malamtakbiran #lebaran #merdekaberbudaya
