    - '"Seberapa aman destinasi wisata favoritmu? Belakangan ini, sejumlah kecelakaan
      di tempat wisata, mulai dari kapal tenggelam di Bengkulu hingga insiden di Labuan
      Bajo menggugah perhatian publik. Sayangnya, masih banyak destinasi wisata di
      Indonesia yang belum memiliki standar manajemen keselamatan yang memadai. Untuk
      menjawab tantangan ini, Kementerian Pariwisata menginisiasi panduan pengelolaan
      risiko keselamatan di destinasi wisata. “Petunjuk teknis ini diharapkan menjadi
      panduan standar dalam memastikan proses penilaian risiko yang terstruktur dan
      terukur,” ujar Bambang Cahyo Murdoko dari Kemenpar. Tak hanya itu, Staf Ahli
      Menteri Pariwisata Fadjar Hutomo menekankan bahwa pariwisata yang berkualitas
      dan berkelanjutan harus memperhatikan keselamatan, bukan hanya bagi wisatawan
      tapi juga masyarakat dan pekerja sektor wisata. Sementara itu, Fatma Lestari,
      Guru Besar FKM UI, menyebutkan pentingnya 10 langkah dalam proses manajemen
      risiko dari identifikasi bahaya hingga pemantauan berkelanjutan. Baca selengkapnya
      di Validnews.id! @kemenpar.ri @fkm_ui #pariwisataindonesia #wisataaman #destinasiwisata
      #keselamatanwisata #tourismsafety #sadarwisata #jagapariwisata #ReferensiTeruji
      #Validnews".'
