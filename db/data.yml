  - - 346
    - '"Melihat Pelangi Senja di Objek Wisata Pantai Ujong Blang Bireuen Laporan Yusmandin
      Idris | Bireuen SERAMBINEWS.COM, BIREUEN – Pantai Ujong Blang, Kecamatan Kuala
      merupakan salah satu objek wisata favorit warga di Bireuen. Kawasan Pantai Ujong
      Blang termasuk lokasi wisata yang paling dekat dengan pusat kota, hanya berjarak
      sekitar 5 KM arah utara Bireuen. Sejak pukul 10.00 WIB pagi, objek wisata pantai
      ini mulai ramai dikunjungi warga yang membawa keluarga. Kawasan ini memiliki
      bibir pantai yang luas dan terdapat sejumlah pondok istirahat serta tersedia
      berbagai macam makanan maupun minuman segar. Pada saat menjelang senja, pengunjung
      pantai Ujong Blang akan disuguhkan pemandangan indah, dengan melihat pantulan
      bias sunset pada ombak laut yang menari. Selain itu, jika cuaca mendukung, dari
      sebelah timur pantai akan muncul fenomena pelangi yang berwarna-warni. Seperti
      terlihat pada Rabu (7/9/2022) sore menjelang matahari terbenam. Munculnya pelangi
      saat detik-detik matahari terbenam, tentunya akan menambah kehangatan bersama
