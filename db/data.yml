  - - 204
    - '"Gerbang Segi Delapan Begitu melangkahkan kaki menuju ke dalam istana, maka
      kita akan disambut dengan bangunan yang semuanya berlapiskan kayu. Bangunan
      ini disebut dengan Gerbang Segi Delapan yang menjadi gerbang pintu masuk halaman
      Istana Alwatzikhoebillah dan memiliki nilai filosofi serta kegunaan tersendiri
      pada zaman dahulu. Gerbang masuk ini dibuat bertingkat dua dengan bentuk segi
      delapan dan memiliki luas 76 meter2. Ruang pada gerbang di bagian bawah difungsikan
      sebagai tempat penjaga dan tempat beristirahat rakyat yang berkunjung ke istana
      sebelum memasuki halaman utama dan bertemu sultan. Sedangkan ruang bagian atas
      berfungsi untuk tempat mengatur penjagaan dan pada saat-saat tertentu digunakan
      sebagai tempat untuk menabuh gamelan dan alat-alat kesenian lainnya. Desainnya
      unik ya? Hmm..memang unik dan menarik. Selain unik, gerbang ini juga memiliki
      nilai filosofi tersendiri. Arti dari bentuk segi delapan adalah delapan penjuru
      mata angin, sehingga kita harus memiliki pandangan serta wawasan dari arah manapun
      dan sebagai bentuk untuk mengenang jasa pendiri istana. Atap Gerbang Segi Delapan
      yang berbentuk segiempat merupakan simbol sultan yang telah mengikuti sifat
      Rasulullah saw. Yakni : Siddiq (Benar), Amanah (Kepercayaan), Tabligh (Menyampaikan),
      dan Fathanah (Pintar). #keratonsambas #sambas #wisatasambas #wisatadaerah".'
