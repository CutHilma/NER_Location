  - - 353
    - '"Batee Iliek Pada tahun 1880, Samalanga berperang melawan Belanda. Pada tanggal
      30 Juni 1880, sebuah detasemen yang dipimpin oleh LetDa. HJ. Berghuis van Woortman
      diserang secara mendadak. Karel van der Heijden harus mengirimkan ekspedisi
      ke sana yang dipimpin oleh May. WA. Schmilau, yang karena itulah tiba di Samalanga
      pada tanggal 14 Juli. Serangan ke benteng Batee Iliek, dekat gampong Aramameh,
      meminta korban 5 orang tewas dan 54 terluka. Van der Heijden tiba di Samalanga
      dan mencoba mengusir Pocut Meligoe, pimpinan pejuang, dari Batee Iliek. Usaha
      itu gagal hingga perlawanan bergeser - yang kembali hasilnya nihil dan menelan
      19 pasukan yang tewas dan 56 terluka. Van der Heijden harus menghentikan usaha
      lebih lanjut untuk merebut pertahanan pejuang Aceh. Melalui tembakan artileri,
      musuh dihalau dari tempat itu dan dalam pertemuan para tetua Samalanga dan beberapa
      tetua dari Jangka Buya yang mulai bergolak, jenderal tersebut berharap agar
      masalah dapat diselesaikan secara damai, sehingga unjuk militer lanjutan tak
      terjadi lagi. Pada tanggal 10 Agustus, pasukan kembali ke Kutaraja (kini Banda
      Aceh). Hingga tahun 1901, Batee Iliek masih menjadi pusat perlawanan sengit.
      Pada tahun itu pula, Joannes Benedictus van Heutsz melancarkan ekspedisi baru
      ke Samalanga. Setelah membunuh banyak pejuang Aceh, ia menuju Batee Iliek. Pada
      tanggal 1 dan 2 Februari, pertahanan pejuang Aceh di Batee Iliek dan Asan Kumbang
      ditembaki oleh angkatan laut dan artileri dari bivak Nanggroe; setelah dimulainya
      serangan, 4 pertahanan pejuang Aceh ditaklukkan, yang setelah itu kedudukan
      musuh yang dipertahankan secara sengit diserbu oleh infanteri, maréchaussée,
      dan divisi pendaratan. Dalam memperkuat diri selama pertempuran sengit, pejuang
      Aceh melemparkan 1 tong mesiu, di mana Let. Verschuir dan 9 orang lainnya terkena
      luka bakar serius. Dengan serbuan ke Batee Iliek itu, beberapa pucuk senjata
      dirampas. Belanda kehilangan beberapa personel: 5 orang tewas dan 29 terluka.(Wikipedia)
      #wisataindonesia #wisatabireuen #wisataaceh #enjoyaceh#bireuen #aceh#bateiliek
      #pesonaindonesia #pesonaaceh #wonderfuldestinations".'
