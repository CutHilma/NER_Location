    - '"Hutan Lindung Wehea adalah hutan yang dilindungi oleh hukum Adat suku Dayak
      Wehea, Setiap pelanggaran, baik itu membunuh binatang atau mengambil kayu tanpa
      izin di dalamnya akan dikenakan sanksi yang tegas. . Untuk menjaga keutuhan
      dan kelestarian Hutan Lindung Wehea, warga Dayak Wehea telah memiliki Tim tersendiri
      untuk menjaga Hutan Lindung ini, Mereka disebut Petkuq Mehuey (PM) dalam bahasa
      Dayak Wehea yang dapat diartikan Penjaga Hutan. Tim ini bertugas menjaga dan
      berpatroli keliling Hutan Lindung Wehea untuk melakukan monitoring, membuat,
      serta memperbaiki jalur-jalur yang ada di dalam hutan. Tugas lain yang tak kalah
      penting yaitu memandu setiap peneliti atau wisatawan yang datang, sekaligus
      menjelaskan setiap keanekaragaman hayati yang ada di dalamnya. Penjagaan ini
      sudah terapkan sejak pertamakali hutan lindung Wehea ditetapkan pada tahun 2004
      silam, dan terus berjalan hingga saat ini. . doc : @nusantara_documentary #huliwa
      #hutanlindungwehea #petkuqmehuey #wehea #hutanadatkalimantan #hutanlindung".'
