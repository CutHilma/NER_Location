    - '"Korupsi hanya 1 atau 2 kali ? Lemahh!! Mantan Gubernur Sumatera Selatan (Sumsel)
      Alex Noerdin kembali ditetapkan menjadi tersangka kasus korupsi oleh Kejaksaan
      Tinggi Sumsel pada Rabu (2/7/2025). Kali ini, Alex ditetapkan sebagai tersangka
      dalam kasus revitalisasi Pasar Cinde yang mangkrak. Aspidsus Umaryadi mengatakan,
      selain Alex, tiga orang lainnya juga ditetapkan sebagai tersangka. Mereka adalah
      Ketua Panitia Pengadaan Badan Usaha Mitra Kerja Sama Bangun Guna Serah Edi hermanto,
      Direktur PT. Magna Beatum Eldrin Tando, dan Kepala Cabang PT. Magna Beatum Rainmar.
      “Tim penyidik telah memeriksa 74 saksi dan mengumpulkan alat bukti yang cukup
      diatur dalam Pasal 184 ayat 1 KUHAP, maka menetapkan empat orang sebagai tersangka,”
      kata Umaryadi, dikutip dari Antara. Sebagai informasi, kasus korupsi Pasar Cinde
      menjadi kasus korupsi ketiga yang menjerat Alex. Saat ditetapkan menjadi tersangka
      kasus ini, Alex bahkan masih menjalani hukuman 9 tahun penjara akibat kasus
      korupsi pembangunan Masjid Sriwijaya Palembang dan kasus pembelian gas bumi
