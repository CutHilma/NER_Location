    - '"Pesisir Selatan, - Kawasan wisata Pantai Penyu yang terdapat di Kampung Pasar
      Amping Parak, Nagari Amping Parak, Kecamatan Sutera, Kabupaten Pesisir Selatan
      (Pessel) terus berkembang dan semakin ramai dikunjungi masyarakat. Kawasan wisata
      bahari yang mulai berkembang sejak tahun 2016 lalu itu, sekarang menjadi salah
      satu kawasan ekowisata penyu yang sudah menjadi kebanggaan di Kabupaten Pesisir
      Selatan.    Sebab dengan berbagai keunggulan yang dimiliki, objek wisata bahari
      yang berjarak sekitar 125 kilometer dari batas Kota Padang dengan lama perjalanan
      sekitar 3 jam itu, sekarang telah mampu menyajikan sejumlah paket kunjungan.
      Hal itu disampaikan Ketua Laskar Turtle Camp (LTC) Amping Parak, Haridman Kambang,
      selaku pengelola kawasan kepada pesisirselatan.go.id Kamis (3/12). "Upaya saya
      bersama anggota LTC Amping Parak mengembangkan kawasan yang selama ini gersang
      dan tidak terjaga, ternyata telah membuahkan hasil. Ini saya katakan, sebab
      tidak kurang sebanyak 1.000 orang pengunjung yang datang ke kawasan ini dalam
      satu pekan," katanya. Dia menyampaikan selain nyaman untuk bersantai bersama
      keluarga sambil berwisata, di kawasan itu juga terdapat beberapa sarana penunjang
      yang akan membuat pengunjung akan semakin betah. "Saya katakan demikian, sebab
      di kawasan ini kami juga menyediakan beberapa fasilitas paket kunjungan seperti
      edukasi tentang penyu, edukasi mangrove dan vegetasi pantai, serta pekat edukasi
      Pengurangan Risiko Bencana (PRB) bagi anak," katanya.   Sarana pendukung untuk
      paket ekowisata edukasi penyu tersebut adalah bak perawatan penyu, rumah penetasan
      perahu, pondok galeri, pondok diskusi, amphitheater. "Sedangkan sarana pendukung
      edukasi mangrove adalah rumah pembibitan mangrove, area penanaman mangrove,
      tracking mangrove dan fasilitator. Paket edukasi untuk anak, kita disediakan
      pula sejumlah game bertema pengurangan risiko bencana," ucapnya. Untuk menambah
      daya tarik bagi pengunjung yang datang dari luar daerah, di kawasan ekowisata
      penyu itu juga disiapkan zona camping ground, dan family gathering. Baca selengkapnya
      di www.pesisirselatankab.co.id Via @pesisirselatan24jam #padangjournal #pesisirselatan24jam
      #beritawisata #infosumbar".'
