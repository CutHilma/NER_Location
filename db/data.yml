  - - 386
    - " \"\U0001F33FTarsius, Primata Mungil Indonesia yang Terancam Dengan tubuh hanya
      10–15 cm dan mata besar yang ikonik, tarsius adalah salah satu primata paling
      unik dan hanya ada di Indonesia! Dari 15 spesies di dunia, 14 di antaranya hidup
      di tanah air, terutama di Sulawesi. Sayangnya, fragmentasi hutan, perburuan,
      dan perdagangan ilegal membuat keberadaan mereka kian terancam. Beberapa spesies
      bahkan masuk dalam daftar merah IUCN, seperti Tarsius Siau yang statusnya kritis.
      \U0001F622 Tarsius hidup monogami, aktif di malam hari, dan sangat bergantung
      pada kelestarian hutan sebagai habitat alaminya. Penangkaran belum efektif,
      sehingga perlindungan hutan menjadi kunci utama konservasi. \U0001F331 Mari
