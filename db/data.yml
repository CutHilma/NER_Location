    - '"[WISATA DAERAH] Tugu Khatulistiwa terletak di Jalan Khatulistiwa, Pontianak,
      Kalimantan Barat. Inilah garis lintang nol derajat bumi, garis yang tepat membelah
      bumi bagian selatan dan bagian utara. Tugu yang asli, berukuran lebih kecil,
      terdapat di dalam komplek bangunan Tugu Khatulistiwa berukuran besar. Setiap
      tanggal 21-23 Maret dan 21-23 September, Tugu Khatulistiwa menjadi lokasi Hari
      Kulminasi Matahari. Titik kulminasi merupakan titik di mana matahari tepat berada
      di atas garis khatulistiwa. Saat fenomena alam ini berlangsung, bayangan tugu
      akan ''menghilang'' selama beberapa detik meskipun diterpa sinar matahari. Demikian
      juga dengan bayangan benda-benda lainnya di sekitar Tugu Khatulistiwa ini menjadi
      tontonan sekaligus wisata mengasyikkan bagi warga Pontianak dan wisatawan lainnya.
      Tak sedikit dari pengunjung yang melihat bayangan mereka sendiri menghilang
      pada saat hari kulminasi ini. Tak hanya itu, wisatawan juga bisa ''melintasi''
      garis khatulistiwa kemudian mendapatkan sertifikat. Dalam sertifikat berjudul
      ''Piagam Perlintasan Khatulistiwa'' itu, tercatat nama serta tanggal dan jam
      kita melintasi garis khatulistiwa. Sumber: wisatapontianak[dot]com Detik[dot]com
      #KIKwisata #khasindonesiaku #indonesiaku #KalimantanbaratKIK #kalimantanbarat
      #borneo #exploreindonesia #explorekalimantan #travelkalimantan #travelling #pesonaindonesia
      #negaraku #indonesiahebat #indonesiakuat #wisata #wisatadaerah".'
