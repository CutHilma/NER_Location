  - - 40
    - "\"* Nikah Massal Hindari Kumpul Kebo dan Zina, Membantu Yang Kurang Mampu Menikah
      Menteri Agama atau Menag RI, Nasaruddin Umar mengungkapkan bahwa peminat program
      nikah massal di Indonesia sangat tinggi. Oleh karena itu, Kementerian Agama
      atau Kemenag berencana memperluas cakupan kegiatan ini ke seluruh wilayah Indonesia.
      Setelah sukses menggelar nikah massal bagi 100 pasangan di Masjid Istiqlal,
      Jakarta, Sabtu, 28 Juni 2025, Kemenag akan kembali memfasilitasi pernikahan
      serupa dengan pembiayaan penuh, mulai dari biaya administrasi, mas kawin, rias
      pengantin, hingga penginapan di hotel. Program ini tidak hanya membantu pasangan
      dari kalangan kurang mampu, tetapi juga menjadi bagian dari kampanye pentingnya
      pencatatan pernikahan dan upaya mencegah praktik kumpul kebo atau perzinahan.
      Dengan antusiasme masyarakat yang tinggi, Kemenag optimistis nikah massal akan
      menjadi program berkelanjutan yang berdampak sosial luas di seluruh Indonesia.
      “Luar biasa peminatnya nikah massal, dalam waktu dekat kita lakukan di seluruh
      Indonesia,” ujar Menteri Agama Nasaruddin Umar di Kantor Kemenag, Jakarta, Jumat
      (4/7) Berdasarkan laporan yang diterimanya, Nasaruddin mengatakan banyak pasangan
      yang tertolong lewat program nikah massal. Pasangan ini, kata Nasaruddin, rata-rata
      dari golongan kurang mampu. Lewat program nikah massal ini, para pasangan tak
      perlu mengeluarkan uang yang biasanya untuk menggelar resepsi sederhana butuh
      biaya hingga Rp 5 juta. Sementara lewat program tersebut, seluruh kebutuhan
      biaya dan lain-lainnya ditanggung Kementerian Agama. “Kalau ada nikah massal
      semua keuangan ditanggung, make up, mas kawin, bahkan hotel, ditanggung Kemenag,”
      kata Nasaruddin. Selain itu, Nasaruddin mengatakan nikah massal ini untuk menghindari
      kumpul kebo dan perzinahan. “Dengan ada nikah massal banyak yang tidak punya
      finansial tertolong. Daripada kumpul kebo perzinahan. Ini (pernikahan massal)
      luar biasa yang akan dilanjutkan ke depan,” pungkasnya. Selengkapnya di tribunnews.com
      Kabar baik, persiapkan diri & tentunya calon pasangan juga!\U0001F606\U0001F601
      #infobandaaceh #aceh #nikahmassal\"."
