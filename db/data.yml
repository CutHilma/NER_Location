    - '"Gunungkidul menyimpan sejuta pesona berupa tempat-tempat dengan pemandangan
      luar biasa indah dan menakjubkan, salah satunya Pantai Watu Lumbung. Bukan pasir
      putih yang biasanya identik dengan pantai. Pantai Watu Lumbung dihiasi bebatuan
      yang tersebar di sepanjang pantai. Pantai ini juga penuh dengan bebatuan dari
      Gunung Batur yang memiliki ciri khas berupa dua bongkahan batu karang besar
      di tengah pantai.. Akses jalannya juga bagus meskipun melewati pedesaan,” kata
      pengunjung Pantai Watu Lumbung Dody Ardian. Daya tarik Pantai Watu Lumbung Pantai
      Watu Lumbung begitu eksotis dengan memiliki bentuk berupa tanjung yang dilengkapi
      dengan tebing curam. Lihat Foto Pantai Watu Lumbung, Gunung Kidul. Bebatuan
      karang yang mendominasi menjadi poin penting dan daya tarik dari Pantai Watu
      Lumbung. Dua batu karang besar yang menjadi maskot dari pantai ini yaitu Watu
      Lumbung dengan ukuran paling besar yang mirip dengan bentuk lumbung padi. Batu
      satunya disebut Watu Semar. Dengan hamtaman ombak yang mengenai batu karang
      dan tebing, membuat pantai ini semakin eksotis dan menakjubkan. Ditambah dengan
      pemandangan laut yang biru dihiasi bebatuan, dijamin feeds di instagram akan
      makin keren. Jangan lewatkan panorama matahari terbenam yang begitu mepesona
      di sini. Tentu saja matahari terbenam juga akan mempercantik postingan Instagram..
      Salah satu spot foto keren berupa batu yang berlubang. Spot foto tersebut menyajikan
      lubang besar dengan latar belakang pemandangan dari tebing curam, pepohonan
      hijau, dan bebatuan karang yang membuat kagum. Meskipun tidak bisa berenang,
      di pantai ini pengunjung bisa melakukan rock fishing atau menangkap ikan di
      celah batu karang. Sumber: Kompas.com #beritajogja #infowisata #panoramaindonesia
      #infojogja #wisatajogja #beritaterkini #likesforlike #pantai #infopantai #panorama
      #watulumbung #pantaigunungkidul #beritawisata #kabarjogja #jogja24jam".'
