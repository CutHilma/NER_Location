  - - 388
    - '"Warung legendaris Mbok Yem di puncak Gunung Lawu resmi tutup sejak 27 Mei
      2025. Buat kamu yang pernah mendaki Lawu, pasti tahu betapa berharganya tempat
      ini. Di ketinggian 3.150 mdpl, warung ini jadi titik harapan—tempat para pendaki
      bisa istirahat, makan nasi pecel hangat, dan ngobrol bareng Mbok Yem yang selalu
      ramah. Sayangnya, Mbok Yem meninggal dunia di usia 82 tahun pada April lalu.
      Dan tak lama setelah itu, pegawai setia yang sudah 19 tahun menemani warung
      ini juga ikut pamit. Ia mengumumkan bahwa warung untuk sementara waktu tidak
      akan beroperasi lagi karena belum ada yang meneruskan. Warung Mbok Yem bukan
      sekadar tempat makan. Ia adalah rumah kecil di tengah jalur pendakian yang menyimpan
      kenangan ribuan orang. Sekarang, semua tinggal cerita—tentang dedikasi, kehangatan,
      dan cinta dari seorang wanita tangguh yang menginspirasi banyak pendaki. Terima
      kasih, Mbok Yem. Namamu akan selalu hidup di hati para pencinta alam. #MbokYem
      #GunungLawu #WarungLegendaris #PendakiIndonesia #CeritaPendaki #Lawu2025 #NasiPecel
      #KenanganLawu #LegendaGunung #InspirasiSejati #AlamIndonesia #BeritaHariIni
      #ViralIndonesia".'
